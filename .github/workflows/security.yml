name: Seguridad
on:
  push:
  pull_request:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seguridad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies-and-secrets:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install -e ".[security,quality]"
      - run: python -m scripts.verificar_dependencias
      - name: Auditar dependencias de ejecución
        run: python -m pip_audit --strict --require-hashes -r requirements-lock.txt
      - name: Auditar el entorno realmente instalado
        run: python -m scripts.auditar_entorno
      - name: Detectar nuevos secretos
        run: python -m scripts.verificar_secretos
  codeql:
    name: CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
