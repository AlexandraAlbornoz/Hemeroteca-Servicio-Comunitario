name: Calidad
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-quality:
    name: Calidad estatica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install -e ".[quality]"
      - run: python -m scripts.verificar_dependencias
      - run: python -m ruff check src scripts tests
      - run: python -m bandit -r src scripts -q
      - run: python -m scripts.comprobar_contraste
